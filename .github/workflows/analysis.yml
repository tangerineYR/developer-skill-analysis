name: Offline historical analysis
on: [push, pull_request]
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest discover -s tests -v
      - run: python visualizer.py --input wanted_jobs.csv --output-dir /tmp/analysis-output
      - name: Verify artifacts and frozen source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          output = Path('/tmp/analysis-output')
          expected = [
            'results/figures/graph_job_role_counts.png',
            'results/figures/graph_skill_heatmap.png',
            'results/figures/graph_skill_category_stacked.png',
          ]
          expected += [
            f'results/figures/graph_top_skills_{role}.png'
            for role in ['서버_개발자', '프론트엔드_개발자', '데이터_사이언티스트']
          ]
          expected += [
            'results/analysis_summary.json',
            'results/sample_audit.json',
            'results/normalization_audit.csv',
          ]
          for name in expected:
              assert (output / name).stat().st_size > 0, name
          for name in ['analysis_summary.json', 'sample_audit.json']:
              assert json.loads((output / 'results' / name).read_text()) == json.loads((Path('results') / name).read_text()), name
          assert (output / 'results/normalization_audit.csv').read_bytes() == Path('results/normalization_audit.csv').read_bytes()
          PY
          git diff --exit-code -- wanted_jobs.csv README.md
          git diff --check
